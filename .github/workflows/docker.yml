name: docker
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/gridwise-llm:v1
      - name: Smoke test (no API keys)
        run: |
          docker run -d -p 8000:8000 --name gw ${{ secrets.DOCKERHUB_USERNAME }}/gridwise-llm:v1
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/health && break; sleep 1; done
          curl -sf http://127.0.0.1:8000/health
          python3 -c "import json; json.dump(json.load(open('tests/public_samples.json'))['cases'][5]['input'], open('/tmp/req.json', 'w'))"
          code=$(curl -s -o /tmp/resp.json -w "%{http_code}" -X POST http://127.0.0.1:8000/optimize-energy \
                 -H "Content-Type: application/json" -d @/tmp/req.json)
          echo "POST /optimize-energy -> $code"
          head -c 400 /tmp/resp.json; echo
          test "$code" = "200"
      - name: Push
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/gridwise-llm:v1
